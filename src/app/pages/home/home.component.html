<section>
  <p *ngIf="loading$ | async">Carregando cotações...</p>

  <p *ngIf="error$ | async as error" class="error">
    {{ error }}
  </p>

  <div *ngIf="currencies$ | async as currencies">
    <app-currency-card
      *ngFor="let currency of currencies"
      [currency]="currency"
    />
  </div>
</section>
