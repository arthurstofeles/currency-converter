<div class="currency-card">
  <h3>{{ currency.name }}</h3>

  <p class="value" [ngClass]="currency.value | currencyValueColor">
    {{ currency.value | currency: 'BRL' }} 
  </p>

  <p class="variation">
    Variação (%) {{ currency.variation }}%
  </p>

  <small class="updated-at">
    Atualizado em:
    {{ currency.updatedAt | date:'HH:mm:ss' }}
  </small>
</div>
