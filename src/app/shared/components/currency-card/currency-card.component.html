<div class="app-currency-card">
  <div class="card-header">
    <h3>{{ title }}</h3>
  </div>
  <div class="card-body">
    <app-loader class="loading-state" *ngIf="state === 'loading'"></app-loader>

    <div *ngIf="state === 'error'" class="error-state">
      <p>{{ errorMessage || "Algo deu errado" }}</p>

      <app-button label="Recarregar" (clicked)="retry.emit()"> </app-button>
    </div>

    <div *ngIf="state === 'success'" class="success-state">
      <p class="currency-value" [ngClass]="currency?.value | currencyValueColor">
        {{ currency?.value | brlValue }}
      </p>
      <div class="currency-box">
        <div class="box-info">
          <span>Variação (%)</span>
          <p>{{ currency?.variation | number:'1.2-2' }}</p>
        </div>
        <div class="box-info">
          <span>Atualizado</span>
          <p>{{ currency?.updatedAt | date: "HH:mm:ss" }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
